server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: always

spring:
  application:
    name: cancer-risk-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/cancer_risk}
    username: ${DB_USERNAME:cancer_risk}
    password: ${DB_PASSWORD:cancer_risk}
    hikari:
      maximum-pool-size: 10
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  data:
    web:
      pageable:
        max-page-size: 100
  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false

app:
  jwt:
    secret: ${JWT_SECRET:change-me-in-env-this-is-only-a-local-development-secret}
    issuer: cancer-risk-backend
    access-token-ttl: ${JWT_ACCESS_TTL:15m}
    refresh-token-ttl: ${JWT_REFRESH_TTL:7d}
  ml:
    base-url: ${ML_SERVICE_URL:http://localhost:5000}
    connect-timeout: ${ML_CONNECT_TIMEOUT:2s}
    read-timeout: ${ML_READ_TIMEOUT:15s}
    max-attempts: ${ML_MAX_ATTEMPTS:3}
    backoff: ${ML_BACKOFF:400ms}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when_authorized
      probes:
        enabled: true

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: alpha
    tags-sorter: alpha

logging:
  level:
    com.cancerrisk: INFO
